name: Sync website copy

on:
  workflow_dispatch:
  schedule:
    - cron: '15 10 * * *'

# security: this workflow only needs to read the repo
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy store and page details from the website to Supabase
        env:
          SUPABASE_URL: https://fdvvqnwoteksztyqadom.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-website.js
