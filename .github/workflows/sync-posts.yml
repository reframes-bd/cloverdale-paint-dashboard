name: Sync Metricool posts and history

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours, 20 minutes past (offset from the other syncs)
    - cron: '20 */6 * * *'

permissions:
  contents: write

concurrency:
  group: repo-data-commit
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull published posts from Metricool
        env:
          METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN }}
          METRICOOL_BRAND_ID: 6980817
          METRICOOL_USER_ID: 5352390
        run: node scripts/sync-posts.js

      - name: Pull monthly history from Metricool (yearly reports)
        # a failure here never blocks the posts update
        continue-on-error: true
        env:
          METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN }}
          METRICOOL_BRAND_ID: 6980817
          METRICOOL_USER_ID: 5352390
        run: node scripts/sync-history.js

      - name: Save to the repository
        run: |
          git config user.name "dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json data/history.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Posts and history $(TZ=America/Vancouver date '+%F %H:%M')"
            git pull --rebase origin main
            git push
          fi
