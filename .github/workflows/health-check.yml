name: Health Check

on:
  workflow_run:
    workflows: ["Deploy Dashboard"]
    types:
      - completed
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    env:
      URL: https://reframes-bd.github.io/cloverdale-paint-dashboard/

    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Check live URL
        id: url
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$URL?t=$(date +%s)")
          if [ "$RESPONSE" -eq 200 ]; then
            echo "Live URL check passed: HTTP $RESPONSE"
          else
            echo "Live URL check failed: HTTP $RESPONSE"
            exit 1
          fi

      - name: Verify login form
        id: login
        run: |
          CONTENT=$(curl -s "$URL?t=$(date +%s)")
          if echo "$CONTENT" | grep -q "type=['\"]password['\"]"; then
            echo "Login form check passed: password field found"
          else
            echo "Login form check failed: password field not found"
            exit 1
          fi

      - name: Verify dashboard sections
        id: sections
        run: |
          CONTENT=$(curl -s "$URL?t=$(date +%s)")
          for id in navSec sec-overview sec-growth sec-reach sec-content sec-inbox; do
            if echo "$CONTENT" | grep -q "id=['\"]$id['\"]"; then
              echo "Section found: $id"
            else
              echo "Section missing: $id"
              exit 1
            fi
          done

      - name: Verify Inbox script
        id: inbox
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${URL}inbox.js?t=$(date +%s)")
          if [ "$RESPONSE" -eq 200 ]; then
            echo "inbox.js served: HTTP $RESPONSE"
          else
            echo "inbox.js missing: HTTP $RESPONSE"
            exit 1
          fi

      - name: Report health status
        if: always()
        run: |
          {
            echo "## Health Check Summary"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then echo "All health checks passed"; else echo "Health check FAILED"; fi
            echo ""
            echo "- Live URL: ${{ steps.url.outcome }}"
            echo "- Login form: ${{ steps.login.outcome }}"
            echo "- Dashboard sections: ${{ steps.sections.outcome }}"
            echo "- Inbox script: ${{ steps.inbox.outcome }}"
            echo ""
            echo "Checked: $URL"
          } >> "$GITHUB_STEP_SUMMARY"
